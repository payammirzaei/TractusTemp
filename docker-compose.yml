services:
  bulk-ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TRACTUSMIND_REF: e8833e565a478cc64837289a96cf2e651620fa2d
    env_file:
      - .env
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    gpus: all
    shm_size: "8gb"
    volumes:
      - ./.model-cache:/models
      - ./state:/state
      - ./repo-cache:/repo-cache
    restart: "no"
